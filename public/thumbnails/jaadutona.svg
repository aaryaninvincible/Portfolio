<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="spacebg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="60%" stop-color="#090014"/>
      <stop offset="100%" stop-color="#020005"/>
    </radialGradient>
    <linearGradient id="magic-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0077"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#spacebg)"/>
  
  <!-- Sacred Geometry Generative Mandala (WebGL simulation) -->
  <g transform="translate(400, 250)">
    <!-- Outer energy rings -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#magic-gold)" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#9d4edd" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="#ff0077" stroke-width="2" opacity="0.8"/>
    
    <!-- Rotated Sacred Hexagons / Star of David -->
    <g stroke="url(#magic-gold)" stroke-width="2" fill="none">
      <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"/>
      <polygon points="-120,0 -60,-104 60,-104 120,0 60,104 -60,104" opacity="0.7"/>
      
      <!-- Intersecting Triangles -->
      <polygon points="0,-110 95,55 -95,55" stroke="#ff0077" stroke-width="2"/>
      <polygon points="0,110 95,-55 -95,-55" stroke="#00f5d4" stroke-width="2"/>
    </g>
    
    <!-- Sacred Flower of Life Circles -->
    <circle cx="0" cy="-50" r="50" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.6"/>
    <circle cx="43" cy="-25" r="50" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.6"/>
    <circle cx="43" cy="25" r="50" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="50" r="50" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.6"/>
    <circle cx="-43" cy="25" r="50" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.6"/>
    <circle cx="-43" cy="-25" r="50" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Center Glowing Singularity Core -->
    <circle cx="0" cy="0" r="28" fill="#ff0077" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="#ffffff"/>
    
    <!-- Particle Rays -->
    <g stroke="rgba(255,255,255,0.4)" stroke-width="1">
      <line x1="0" y1="-190" x2="0" y2="-220"/>
      <line x1="134" y1="-134" x2="155" y2="-155"/>
      <line x1="190" y1="0" x2="220" y2="0"/>
      <line x1="134" y1="134" x2="155" y2="155"/>
      <line x1="0" y1="190" x2="0" y2="220"/>
      <line x1="-134" y1="134" x2="-155" y2="155"/>
      <line x1="-190" y1="0" x2="-220" y2="0"/>
      <line x1="-134" y1="-134" x2="-155" y2="-155"/>
    </g>
  </g>
  
  <!-- UI Telemetry Overlays -->
  <g transform="translate(60, 50)">
    <text x="0" y="20" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" letter-spacing="3">JAADUTONA</text>
    <text x="0" y="42" fill="#00f5d4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">GENERATIVE GLSL AUDIO-VISUALS</text>
  </g>
  
  <g transform="translate(560, 50)">
    <rect x="0" y="0" width="180" height="34" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,0,119,0.4)"/>
    <text x="14" y="22" fill="#ff0077" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">60 FPS WEB AUDIO</text>
  </g>
  
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="300" height="36" rx="8" fill="rgba(0,0,0,0.8)" stroke="rgba(157,78,221,0.4)"/>
    <text x="16" y="23" fill="#c77dff" font-family="'JetBrains Mono', monospace" font-size="11">✨ Harmonic Frequency Resonator</text>
  </g>
</svg>
