<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7300"/>
      <stop offset="100%" stop-color="#ffaa00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  
  <!-- Extension Browser Window Mockup -->
  <rect x="70" y="50" width="660" height="400" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1.5" filter="drop-shadow(0 15px 35px rgba(0,0,0,0.6))"/>
  
  <!-- Window Header -->
  <rect x="70" y="50" width="660" height="46" rx="16" fill="rgba(10, 15, 29, 0.95)"/>
  <rect x="70" y="80" width="660" height="16" fill="rgba(10, 15, 29, 0.95)"/>
  <circle cx="102" cy="73" r="6" fill="#ef4444"/>
  <circle cx="122" cy="73" r="6" fill="#f59e0b"/>
  <circle cx="142" cy="73" r="6" fill="#10b981"/>
  
  <rect x="180" y="62" width="360" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  <text x="195" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">chrome-extension://lms-booster/dashboard.html</text>
  
  <!-- Badge -->
  <rect x="560" y="62" width="150" height="24" rx="6" fill="rgba(0, 243, 255, 0.15)" stroke="rgba(0, 243, 255, 0.4)"/>
  <text x="580" y="78" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="10">MANIFEST V3 ACTIVE</text>
  
  <!-- Window Content -->
  <!-- Left Side: Status & Telemetry -->
  <rect x="100" y="120" width="260" height="135" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="120" y="148" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ACTIVE LMS ENGINE</text>
  <text x="120" y="178" fill="#f8fafc" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold">Coursera &amp; edX Booster</text>
  <rect x="120" y="195" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="120" y="195" width="180" height="8" rx="4" fill="url(#chrome-grad)"/>
  <text x="120" y="228" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">● Always-Active Tab Persistence (100%)</text>
  
  <!-- Right Side: Video Speed Accelerators -->
  <rect x="380" y="120" width="320" height="135" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="400" y="148" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">UNIVERSAL PLAYBACK ENGINE</text>
  <g transform="translate(400, 165)">
    <rect x="0" y="0" width="60" height="32" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="16" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">1.5x</text>
    
    <rect x="70" y="0" width="60" height="32" rx="6" fill="rgba(255,255,255,0.06)"/>
    <text x="86" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">2.5x</text>
    
    <rect x="140" y="0" width="60" height="32" rx="6" fill="url(#orange-grad)"/>
    <text x="156" y="20" fill="#000" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="12">4.0x</text>
    
    <rect x="210" y="0" width="70" height="32" rx="6" fill="rgba(0, 243, 255, 0.15)" stroke="rgba(0,243,255,0.4)"/>
    <text x="226" y="20" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-weight="bold" font-size="12">MAX 16x</text>
  </g>
  <text x="400" y="235" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">⚡ Zero-Tab Throttling Bypass Active</text>
  
  <!-- Bottom Cards: Passkey Vault & Auto-Quiz -->
  <rect x="100" y="275" width="290" height="145" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="120" y="305" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">PASSKEY VAULT SECURITY</text>
  <text x="120" y="335" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">Zero-Knowledge Token Store</text>
  <text x="120" y="365" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Encrypted IndexedDB AES-GCM</text>
  <text x="120" y="395" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">🔒 Security Passkey Locked</text>
  
  <rect x="410" y="275" width="290" height="145" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <text x="430" y="305" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">STUDY TELEMETRY DASHBOARD</text>
  <text x="430" y="335" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold">42+ Hours Saved This Month</text>
  <text x="430" y="365" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Real-time LMS event dispatch</text>
  <text x="430" y="395" fill="#ff7300" font-family="'JetBrains Mono', monospace" font-size="11">🔥 98.4% Efficiency Rating</text>
</svg>
