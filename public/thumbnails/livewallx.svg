<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="wallbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#0070f3"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#wallbg)"/>
  
  <!-- Ambient background glow behind phone -->
  <circle cx="400" cy="250" r="180" fill="url(#phone-glow)" opacity="0.25" filter="blur(60px)"/>
  
  <!-- Left Phone Mockup (Angled) -->
  <g transform="translate(180, 50) rotate(-6)">
    <rect x="0" y="0" width="180" height="370" rx="28" fill="#121215" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect x="8" y="8" width="164" height="354" rx="22" fill="#000000"/>
    
    <!-- AMOLED Parallax Artwork 1 -->
    <path d="M8,180 Q90,120 172,200 L172,362 L8,362 Z" fill="#7928ca" opacity="0.8"/>
    <circle cx="90" cy="140" r="45" fill="#ff0080" opacity="0.9"/>
    <circle cx="130" cy="100" r="20" fill="#00f3ff" opacity="0.7"/>
    
    <text x="30" y="50" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="bold">10:42</text>
    <text x="30" y="68" fill="#a1a1aa" font-family="'Space Grotesk', sans-serif" font-size="10">Wed, Sep 28</text>
  </g>
  
  <!-- Center Main Phone Mockup -->
  <g transform="translate(310, 35)">
    <!-- Phone Bezel -->
    <rect x="0" y="0" width="200" height="420" rx="32" fill="#18181b" stroke="url(#neon-cyan)" stroke-width="2.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))"/>
    
    <!-- Phone Screen -->
    <rect x="8" y="8" width="184" height="404" rx="26" fill="#030305"/>
    
    <!-- Dynamic Island / Punch Hole Camera -->
    <rect x="72" y="18" width="56" height="18" rx="9" fill="#000"/>
    
    <!-- AMOLED 4K Fluid Wave Wallpaper Art -->
    <g transform="translate(8, 50)">
      <path d="M0,160 C50,110 130,220 184,140 L184,360 L0,360 Z" fill="url(#phone-glow)" opacity="0.85"/>
      <path d="M0,220 C60,170 120,270 184,210 L184,360 L0,360 Z" fill="#00f3ff" opacity="0.4"/>
      
      <!-- Gyroscope Parallax Particles -->
      <circle cx="40" cy="90" r="3" fill="#fff" opacity="0.9"/>
      <circle cx="140" cy="130" r="4" fill="#00f3ff" opacity="0.8"/>
      <circle cx="90" cy="60" r="2.5" fill="#ff0080" opacity="0.9"/>
      <circle cx="160" cy="240" r="5" fill="#fff" opacity="0.7"/>
      
      <!-- AMOLED Clock -->
      <text x="92" y="55" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="900" letter-spacing="1">12:30</text>
      <text x="92" y="78" text-anchor="middle" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">60 FPS GYROSCOPE</text>
    </g>
    
    <!-- Bottom App Dock -->
    <rect x="24" y="360" width="152" height="44" rx="22" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="48" cy="382" r="12" fill="#00f3ff" opacity="0.8"/>
    <circle cx="80" cy="382" r="12" fill="#7928ca" opacity="0.8"/>
    <circle cx="112" cy="382" r="12" fill="#ff0080" opacity="0.8"/>
    <circle cx="144" cy="382" r="12" fill="#ffaa00" opacity="0.8"/>
  </g>
  
  <!-- Right Phone Mockup (Angled) -->
  <g transform="translate(480, 50) rotate(6)">
    <rect x="0" y="0" width="180" height="370" rx="28" fill="#121215" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect x="8" y="8" width="164" height="354" rx="22" fill="#000000"/>
    
    <!-- AMOLED Parallax Artwork 2 -->
    <circle cx="82" cy="180" r="60" fill="url(#neon-cyan)" opacity="0.75"/>
    <path d="M8,260 Q82,210 172,280 L172,362 L8,362 Z" fill="#ff0080" opacity="0.6"/>
  </g>
  
  <!-- Telemetry Overlay Badges -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="rgba(0,0,0,0.85)" stroke="rgba(0,243,255,0.4)"/>
    <text x="18" y="23" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">⚡ Flutter Multi-Layer Shaders</text>
  </g>
  
  <g transform="translate(520, 420)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="rgba(0,0,0,0.85)" stroke="rgba(255,0,128,0.4)"/>
    <text x="18" y="23" fill="#ff0080" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">🔋 &lt;2% Battery Drain Engine</text>
  </g>
</svg>
