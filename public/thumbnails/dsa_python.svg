<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="dsabg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#070c16"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffde57"/>
      <stop offset="100%" stop-color="#4584b6"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#dsabg)"/>
  
  <!-- Terminal Window Frame -->
  <rect x="70" y="45" width="660" height="410" rx="14" fill="#0d1117" stroke="rgba(69, 132, 182, 0.4)" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="70" y="45" width="660" height="40" rx="14" fill="#161b22"/>
  <rect x="70" y="72" width="660" height="13" fill="#161b22"/>
  <circle cx="95" cy="65" r="5" fill="#f85149"/>
  <circle cx="112" cy="65" r="5" fill="#e3b341"/>
  <circle cx="129" cy="65" r="5" fill="#3fb950"/>
  
  <text x="300" y="70" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="12">python3 -m pytest tests/benchmarks.py</text>
  
  <!-- Terminal Content Split View -->
  <!-- Left Side: Code & Benchmark CLI Output -->
  <g transform="translate(100, 115)">
    <text x="0" y="0" fill="#58a6ff" font-family="'Fira Code', monospace" font-size="12">class</text>
    <text x="45" y="0" fill="#ffa657" font-family="'Fira Code', monospace" font-size="12">AVLTree</text>
    <text x="100" y="0" fill="#c9d1d9" font-family="'Fira Code', monospace" font-size="12">(Generic[T]):</text>
    
    <text x="20" y="24" fill="#ff7b72" font-family="'Fira Code', monospace" font-size="11">def</text>
    <text x="50" y="24" fill="#d2a8ff" font-family="'Fira Code', monospace" font-size="11">rotate_left</text>
    <text x="135" y="24" fill="#c9d1d9" font-family="'Fira Code', monospace" font-size="11">(self, z: Node) -&gt; Node:</text>
    
    <text x="40" y="44" fill="#c9d1d9" font-family="'Fira Code', monospace" font-size="11">y = z.right; T2 = y.left</text>
    <text x="40" y="64" fill="#c9d1d9" font-family="'Fira Code', monospace" font-size="11">y.left = z; z.right = T2</text>
    <text x="40" y="84" fill="#7ee787" font-family="'Fira Code', monospace" font-size="11">return y  # O(1) time balance</text>
    
    <!-- Test Benchmarks Box -->
    <rect x="0" y="115" width="280" height="185" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="15" y="140" fill="#58a6ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">BENCHMARK RESULTS (100k Items)</text>
    
    <text x="15" y="170" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="11">PASSED</text>
    <text x="75" y="170" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="11">Dijkstra Heap: 14.2ms</text>
    
    <text x="15" y="195" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="11">PASSED</text>
    <text x="75" y="195" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="11">AVL Balanced: 8.4ms</text>
    
    <text x="15" y="220" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="11">PASSED</text>
    <text x="75" y="220" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="11">A* Spatial Graph: 11.6ms</text>
    
    <text x="15" y="245" fill="#7ee787" font-family="'JetBrains Mono', monospace" font-size="11">PASSED</text>
    <text x="75" y="245" fill="#c9d1d9" font-family="'JetBrains Mono', monospace" font-size="11">QuickSelect Med: 3.1ms</text>
    
    <text x="15" y="280" fill="#3fb950" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">100% tests passed in 0.42s</text>
  </g>
  
  <!-- Right Side: Graph / Tree Visual Representation -->
  <g transform="translate(420, 115)">
    <rect x="0" y="0" width="280" height="300" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="30" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">GRAPH TOPOLOGY &amp; BST BALANCING</text>
    
    <!-- Tree Nodes & Edges -->
    <g stroke="#388bfd" stroke-width="2">
      <!-- Root to children -->
      <line x1="140" y1="75" x2="80" y2="135"/>
      <line x1="140" y1="75" x2="200" y2="135"/>
      
      <!-- Left child to grandchildren -->
      <line x1="80" y1="135" x2="45" y2="195"/>
      <line x1="80" y1="135" x2="115" y2="195"/>
      
      <!-- Right child to grandchildren -->
      <line x1="200" y1="135" x2="165" y2="195"/>
      <line x1="200" y1="135" x2="235" y2="195"/>
    </g>
    
    <!-- Node circles -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">
      <!-- Root (50) -->
      <circle cx="140" cy="75" r="18" fill="#1f6feb" stroke="#58a6ff" stroke-width="2"/>
      <text x="140" y="80" fill="#ffffff">50</text>
      
      <!-- Left (30) -->
      <circle cx="80" cy="135" r="16" fill="#238636" stroke="#3fb950" stroke-width="2"/>
      <text x="80" y="140" fill="#ffffff">30</text>
      
      <!-- Right (70) -->
      <circle cx="200" cy="135" r="16" fill="#8957e5" stroke="#a371f7" stroke-width="2"/>
      <text x="200" y="140" fill="#ffffff">70</text>
      
      <!-- Leaves -->
      <circle cx="45" cy="195" r="14" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
      <text x="45" y="199" fill="#c9d1d9">20</text>
      
      <circle cx="115" cy="195" r="14" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
      <text x="115" y="199" fill="#c9d1d9">40</text>
      
      <circle cx="165" cy="195" r="14" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
      <text x="165" y="199" fill="#c9d1d9">60</text>
      
      <circle cx="235" cy="195" r="14" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>
      <text x="235" y="199" fill="#c9d1d9">85</text>
    </g>
    
    <!-- Big-O Complexity Badge -->
    <rect x="25" y="245" width="230" height="36" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="35" y="267" fill="#e3b341" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">Time: O(log N) | Space: O(N)</text>
  </g>
</svg>
