<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="andr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071a12"/>
      <stop offset="50%" stop-color="#0b1712"/>
      <stop offset="100%" stop-color="#040a07"/>
    </linearGradient>
    <linearGradient id="material-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#00a854"/>
    </linearGradient>
    <linearGradient id="material-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0bcff"/>
      <stop offset="100%" stop-color="#6750a4"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#andr-bg)"/>
  
  <!-- Subtle Ambient Glow -->
  <circle cx="400" cy="250" r="220" fill="#3ddc84" opacity="0.12" filter="blur(70px)"/>
  
  <!-- Android Phone Mockup Frame -->
  <rect x="230" y="30" width="340" height="440" rx="36" fill="#141a16" stroke="rgba(61, 220, 132, 0.4)" stroke-width="2" filter="drop-shadow(0 20px 45px rgba(0,0,0,0.8))"/>
  
  <!-- Screen Inner -->
  <rect x="240" y="40" width="320" height="420" rx="28" fill="#111613"/>
  
  <!-- Camera cutout -->
  <circle cx="400" cy="55" r="7" fill="#000"/>
  
  <!-- Status bar -->
  <text x="260" y="58" fill="#e1e3e0" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold">9:41</text>
  <text x="520" y="58" fill="#e1e3e0" font-family="'Space Grotesk', sans-serif" font-size="10">5G 98%</text>
  
  <!-- Widget 1: System Telemetry (Glance AppWidget 4x2) -->
  <rect x="255" y="75" width="290" height="115" rx="22" fill="#1e2621" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <g transform="translate(275, 95)">
    <circle cx="15" cy="15" r="15" fill="url(#material-green)"/>
    <text x="15" y="20" text-anchor="middle" fill="#00391d" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="14">⚡</text>
    
    <text x="42" y="14" fill="#c4eed0" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold">Glint Hardware HUD</text>
    <text x="42" y="28" fill="#8ba292" font-family="'JetBrains Mono', monospace" font-size="9">Jetpack Compose Glance</text>
    
    <!-- RAM / CPU Pill Indicators -->
    <rect x="0" y="45" width="115" height="36" rx="12" fill="#29322c"/>
    <text x="12" y="60" fill="#8ba292" font-family="'JetBrains Mono', monospace" font-size="9">CPU FREQ</text>
    <text x="12" y="74" fill="#3ddc84" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12">2.84 GHz (42°)</text>
    
    <rect x="135" y="45" width="115" height="36" rx="12" fill="#29322c"/>
    <text x="147" y="60" fill="#8ba292" font-family="'JetBrains Mono', monospace" font-size="9">RAM USAGE</text>
    <text x="147" y="74" fill="#80e0a7" font-family="'Space Grotesk', sans-serif" font-weight="bold" font-size="12">4.2 / 12 GB</text>
  </g>
  
  <!-- Widget 2: Weather & Dynamic Atmosphere (2x2) -->
  <rect x="255" y="200" width="140" height="130" rx="22" fill="#242338" stroke="rgba(208, 188, 255, 0.2)" stroke-width="1"/>
  <g transform="translate(270, 220)">
    <text x="0" y="15" fill="#d0bcff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold">24°</text>
    <text x="0" y="35" fill="#e6e0e9" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold">Partly Sunny</text>
    <text x="0" y="52" fill="#958da5" font-family="'JetBrains Mono', monospace" font-size="9">AQI 42 • Good</text>
    <circle cx="85" cy="65" r="22" fill="#ffb74d" opacity="0.8"/>
  </g>
  
  <!-- Widget 3: Battery Health & Fast Charge (2x2) -->
  <rect x="405" y="200" width="140" height="130" rx="22" fill="#1e2621" stroke="rgba(61, 220, 132, 0.2)" stroke-width="1"/>
  <g transform="translate(420, 220)">
    <text x="0" y="18" fill="#8ba292" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">BATTERY HEALTH</text>
    <text x="0" y="50" fill="#3ddc84" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="bold">98%</text>
    <text x="0" y="72" fill="#c4eed0" font-family="'Space Grotesk', sans-serif" font-size="11">Turbo 65W Active</text>
    <text x="0" y="90" fill="#8ba292" font-family="'JetBrains Mono', monospace" font-size="9">Est. 1d 14h left</text>
  </g>
  
  <!-- Android App Dock -->
  <rect x="255" y="350" width="290" height="70" rx="24" fill="rgba(255,255,255,0.06)"/>
  <circle cx="285" cy="385" r="18" fill="#3ddc84"/>
  <circle cx="340" cy="385" r="18" fill="#d0bcff"/>
  <circle cx="400" cy="385" r="18" fill="#ffb784"/>
  <circle cx="460" cy="385" r="18" fill="#a8c7fa"/>
  <circle cx="515" cy="385" r="18" fill="#f2b8b5"/>
  
  <!-- Home navigation bar pill -->
  <rect x="365" y="440" width="70" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- Outer Banner Badges -->
  <rect x="50" y="180" width="150" height="50" rx="10" fill="rgba(0,0,0,0.8)" stroke="#3ddc84" stroke-width="1.5"/>
  <text x="65" y="203" fill="#3ddc84" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">KOTLIN COROUTINES</text>
  <text x="65" y="219" fill="#8ba292" font-family="'Space Grotesk', sans-serif" font-size="10">Zero-WakeLock Polling</text>
  
  <rect x="600" y="180" width="160" height="50" rx="10" fill="rgba(0,0,0,0.8)" stroke="#d0bcff" stroke-width="1.5"/>
  <text x="615" y="203" fill="#d0bcff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">MATERIAL YOU M3</text>
  <text x="615" y="219" fill="#958da5" font-family="'Space Grotesk', sans-serif" font-size="10">Dynamic System Theming</text>
</svg>
